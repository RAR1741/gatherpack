services:
  app:
    env_file: ".env"
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && ./bin/dev"
    volumes:
      - .:/rails
      - /rails/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: 'password'
    volumes:
      - /tmp/gather-db:/var/lib/postgresql/data
    ports:
      - 5432:5432

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - '1080:1080'
      - '1025:1025'
